name: Comprobar ejercicios de gramática y publicación web

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/repaso-morfologia
      - feature/pestanas-navegacion-unificada
    paths:
      - '.github/workflows/check-grammar-web.yml'
      - 'tests/**'
      - 'gramatica*'
      - 'morfologia*'
      - 'data/unimorph-syllabus/**'
      - 'index.html'
      - 'teacher.js'
      - 'config.js'
      - 'data.js'
      - 'style.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Validación antes de publicar en clase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código de la propuesta
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis del motor
        run: |
          node --check gramatica-respaldo-online.js
          node --check gramatica.js
          node --check gramatica-importada.js
          node --check gramatica-paradigmas.js
          node --check gramatica-griego-ampliacion.js
          node --check gramatica-admin.js
          node --check teacher.js
          node --check tests/check-grammar.cjs
          node --check tests/check-web-release.cjs
          node --check tests/check-grammar-browser.cjs
      - name: Comprobar el respaldo online con un banco de prueba
        run: node tests/check-online-backup.cjs
      - name: Diagnosticar APIs de respaldo sin importar resultados
        run: node scripts/probe_morphology_services.mjs
      - name: Comprobar autocorrección y currículo
        run: node tests/check-grammar.cjs
      - name: Comprobar ejercicios UniMorph
        run: node tests/check-unimorph-import.mjs
      - name: Comprobar archivos de la web publicados
        run: node tests/check-web-release.cjs
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar la web de clase con Chromium
        run: node tests/check-grammar-browser.cjs
